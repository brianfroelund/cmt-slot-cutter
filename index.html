<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>slotcutter — CMT 8/923.001 calculator</title>
  <meta name="theme-color" content="#fdf6e3" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#002b36" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <style>
    :root {
      --base03: #002b36;
      --base02: #073642;
      --base01: #586e75;
      --base00: #657b83;
      --base0: #839496;
      --base1: #93a1a1;
      --base2: #eee8d5;
      --base3: #fdf6e3;
      --yellow: #b58900;
      --orange: #cb4b16;
      --red: #dc322f;
      --blue: #268bd2;

      --paper: var(--base3);
      --surface: var(--base3);
      --sunken: var(--base2);
      --ink: var(--base02);
      --ink-soft: var(--base01);
      --rule: #e2dbc6;
      --rule-strong: var(--base1);
      --accent: var(--orange);
      --focus: var(--blue);
      --danger: var(--red);

      --font-sans:
        ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      --font-serif: 'Iowan Old Style', 'Charter', 'Palatino Linotype', Palatino, Georgia, serif;

      --radius: 10px;
      --radius-sm: 6px;
      --tap: 42px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: var(--base03);
        --surface: var(--base03);
        --sunken: var(--base02);
        --ink: var(--base1);
        --ink-soft: var(--base0);
        --rule: #0d4351;
        --rule-strong: var(--base01);
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      font: 16px/1.5 var(--font-sans);
      color: var(--ink);
      background: var(--paper);
      font-variant-numeric: tabular-nums;
    }

    ::selection {
      background: var(--base2);
      color: var(--base03);
    }

    button, input, select {
      font: inherit;
      color: inherit;
    }

    :focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    [hidden] {
      display: none !important;
    }

    /* ---------- Header ---------- */

    .topbar {
      border-bottom: 1px solid var(--rule);
    }

    .topbar-row {
      display: flex;
      align-items: center;
      max-width: 960px;
      margin: 0 auto;
      padding: var(--space-2) var(--space-4);
      min-height: 50px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-serif);
      font-size: 1.2rem;
      font-weight: 600;
    }

    .brand-mark svg {
      display: block;
      width: 22px;
      height: 22px;
      color: var(--accent);
      transition: transform 0.8s var(--ease);
    }

    .brand:hover .brand-mark svg {
      transform: rotate(360deg);
    }

    .brand-sub {
      font-family: var(--font-sans);
      font-size: 0.82rem;
      font-weight: 400;
      color: var(--ink-soft);
    }

    /* ---------- Layout ---------- */

    .layout {
      display: grid;
      gap: var(--space-5);
      max-width: 960px;
      margin: 0 auto;
      padding: var(--space-4);
      align-items: start;
    }

    @media (min-width: 760px) {
      .layout {
        grid-template-columns: 280px 1fr;
        padding: var(--space-5) var(--space-4);
      }
    }

    .card {
      padding: var(--space-4);
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
    }

    /* ---------- Controls ---------- */

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 3px;
      border: 1px solid var(--rule-strong);
      border-radius: var(--radius-sm);
    }

    .seg-btn {
      min-height: 34px;
      padding: 0 var(--space-3);
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--ink-soft);
      cursor: pointer;
    }

    .seg-btn[aria-checked='true'] {
      background: var(--sunken);
      color: var(--ink);
      font-weight: 600;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: var(--space-3);
    }

    .field-label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--ink-soft);
    }

    .input-wrap {
      position: relative;
      display: flex;
    }

    .input-wrap input,
    .select-input {
      width: 100%;
      min-height: var(--tap);
      padding: 8px 10px;
      border: 1px solid var(--rule);
      border-radius: var(--radius-sm);
      background: var(--paper);
      font-size: 1rem;
      font-weight: 600;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .input-wrap input {
      padding-right: 36px;
    }

    .input-wrap input:focus,
    .select-input:focus {
      outline: none;
      border-color: var(--rule-strong);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 18%, transparent);
    }

    .suffix {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      font-size: 0.8rem;
      font-weight: 400;
      color: var(--base1);
      pointer-events: none;
    }

    .switch {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      margin-top: var(--space-3);
      font-size: 0.84rem;
      color: var(--ink-soft);
      cursor: pointer;
      user-select: none;
    }

    .switch input {
      appearance: none;
      position: relative;
      flex: none;
      width: 34px;
      height: 19px;
      margin: 0;
      border: 1px solid var(--rule-strong);
      border-radius: 999px;
      background: var(--sunken);
      cursor: pointer;
    }

    .switch input::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--ink-soft);
      transition: transform 0.2s var(--ease);
    }

    .switch input:checked {
      background: var(--ink-soft);
    }

    .switch input:checked::after {
      background: var(--paper);
      transform: translateX(15px);
    }

    /* ---------- Alternative Stacks ---------- */

    .alt-section {
      margin-top: var(--space-4);
      padding-top: var(--space-3);
      border-top: 1px dashed var(--rule);
    }

    .alt-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .alt-btn {
      padding: 4px 9px;
      border: 1px solid var(--rule);
      border-radius: var(--radius-sm);
      background: transparent;
      cursor: pointer;
      font-size: 0.8rem;
      color: var(--ink-soft);
    }

    .alt-btn:hover {
      background: var(--sunken);
      color: var(--ink);
    }

    .alt-btn[aria-selected='true'] {
      background: var(--sunken);
      border-color: var(--rule-strong);
      color: var(--ink);
      font-weight: 600;
    }

    /* ---------- Illustration Stage ---------- */

    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .warn-box {
      padding: var(--space-3);
      border-radius: var(--radius-sm);
      border: 1px solid var(--danger);
      color: var(--danger);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="8" />
            <circle cx="12" cy="12" r="2.8" />
            <path d="M12 2v2.5M20.66 17l-2.16-1.25M3.34 17l2.16-1.25" />
          </svg>
        </span>
        <span>slotcutter</span>
        <span class="brand-sub">CMT 8/923.001</span>
      </div>
    </div>
  </header>

  <main class="layout">
    <!-- Controls Card -->
    <section class="card">
      <div class="segmented" role="radiogroup" aria-label="Cut type">
        <button type="button" class="seg-btn" id="tabGroove" role="radio" aria-checked="true">Groove</button>
        <button type="button" class="seg-btn" id="tabTongue" role="radio" aria-checked="false">Tongue</button>
      </div>

      <!-- GROOVE -->
      <div id="grooveControls">
        <div class="field">
          <label class="field-label" for="grooveWidth">Groove width</label>
          <div class="input-wrap">
            <input type="number" id="grooveWidth" min="2.0" max="26.0" step="0.1" value="18.0" />
            <span class="suffix">mm</span>
          </div>
        </div>
      </div>

      <!-- TONGUE -->
      <div id="tongueControls" hidden>
        <div class="field">
          <label class="field-label" for="tongueWidth">Tongue thickness</label>
          <div class="input-wrap">
            <input type="number" id="tongueWidth" min="3.2" max="16.0" step="0.1" value="6.0" />
            <span class="suffix">mm</span>
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="topCutWidth" id="topCutLabel">Shoulder width (each side)</label>
          <div class="input-wrap">
            <input type="number" id="topCutWidth" min="1.0" max="16.0" step="0.1" value="5.0" />
            <span class="suffix">mm</span>
          </div>
        </div>

        <div class="field" id="botCutGroup" hidden>
          <label class="field-label" for="botCutWidth">Bottom shoulder width</label>
          <div class="input-wrap">
            <input type="number" id="botCutWidth" min="1.0" max="16.0" step="0.1" value="5.0" />
            <span class="suffix">mm</span>
          </div>
        </div>

        <label class="switch">
          <input type="checkbox" id="symCheck" checked />
          <span>Symmetric shoulders</span>
        </label>
      </div>

      <!-- Cutting Depth -->
      <div class="field">
        <label class="field-label" for="bearingSelect">Cutting depth</label>
        <select id="bearingSelect" class="select-input">
          <option value="6982-2Z">14.3 mm</option>
          <option value="608-2Z" selected>12.7 mm</option>
          <option value="R8ZZ">9.5 mm</option>
          <option value="79103300">8.0 mm</option>
        </select>
      </div>

      <!-- Compact Alternative Picker -->
      <div class="alt-section" id="altSection">
        <div class="field-label">Cutter combination</div>
        <div class="alt-list" id="altList"></div>
      </div>
    </section>

    <!-- Illustration Stage -->
    <div class="stage">
      <div id="errorBox" class="warn-box" hidden></div>
      <div id="svgContainer" style="width: 100%; display: flex; justify-content: center;"></div>
    </div>
  </main>

  <script>
    // Measured cutter dimensions + exact set inventory (1x 2mm, 1x 3mm, 1x 4mm, 3x 5mm, 1x 6mm)
    const CUTTER_SPECS = [
      { id: 2, name: "2 mm", width: 2.0, body: 1.30, overhang: 0.35, maxQty: 1 },
      { id: 3, name: "3 mm", width: 3.0, body: 1.30, overhang: 0.85, maxQty: 1 },
      { id: 4, name: "4 mm", width: 4.0, body: 2.10, overhang: 0.95, maxQty: 1 },
      { id: 5, name: "5 mm", width: 5.0, body: 2.90, overhang: 1.05, maxQty: 3 },
      { id: 6, name: "6 mm", width: 6.0, body: 4.50, overhang: 0.75, maxQty: 1 }
    ];

    const BEARINGS = {
      "6982-2Z":  { id: "6982-2Z",  od: 19.0, height: 5.90, depth: 14.3 },
      "608-2Z":   { id: "608-2Z",   od: 22.0, height: 6.00, depth: 12.7 },
      "R8ZZ":     { id: "R8ZZ",     od: 28.5, height: 7.90, depth: 9.5  },
      "79103300": { id: "79103300", od: 31.5, height: 4.90, depth: 8.0  }
    };

    const toTenths = (mm) => Math.round(mm * 10);

    // Decompose a single shim gap (in tenths of mm).
    // Note: there is only ONE 0.3 mm spacer in the set, so allow03 controls whether this gap can use it.
    function decomposeShims(tenths, allow03 = false) {
      let rem = Math.max(0, Math.round(tenths));
      const sizes = [
        { label: "4", val: 40, max: Infinity },
        { label: "1", val: 10, max: Infinity },
        { label: "0.5", val: 5, max: Infinity },
        { label: "0.3", val: 3, max: allow03 ? 1 : 0 },
        { label: "0.1", val: 1, max: Infinity }
      ];
      const parts = [];
      const washers = [];
      let used03 = false;
      for (const s of sizes) {
        if (s.max === 0) continue;
        const count = Math.min(s.max, Math.floor(rem / s.val));
        if (count > 0) {
          parts.push({ ...s, count });
          for (let i = 0; i < count; i++) washers.push(s.val);
          rem -= count * s.val;
          if (s.val === 3) used03 = true;
        }
      }
      const formula = parts.map((p) => (p.count > 1 ? `${p.count}×${p.label}` : `${p.label}`)).join(" + ");
      return {
        tenths: Math.round(tenths),
        mm: (Math.round(tenths) / 10).toFixed(1),
        parts,
        washers,
        formula,
        used03,
        totalCount: washers.length
      };
    }

    // Decompose an array of shim gaps across the arbor, using the single 0.3mm spacer in at most ONE gap
    function decomposeGapList(gapsTenths, canUse03 = true) {
      let available03 = canUse03;
      return gapsTenths.map((t) => {
        const d = decomposeShims(t, available03);
        if (d.used03) available03 = false;
        return d;
      });
    }

    function getAllMultisets() {
      const multisets = [];
      function build(idx, counts, picked) {
        if (idx === CUTTER_SPECS.length) {
          if (picked.length > 0 && picked.length <= 5) {
            const sorted = [...picked].sort((a, b) => b.width - a.width);
            multisets.push({ counts: { ...counts }, cutters: sorted });
          }
          return;
        }
        const spec = CUTTER_SPECS[idx];
        for (let q = 0; q <= spec.maxQty; q++) {
          counts[spec.id] = q;
          for (let k = 0; k < q; k++) picked.push(spec);
          build(idx + 1, counts, picked);
          for (let k = 0; k < q; k++) picked.pop();
        }
      }
      build(0, {}, []);
      return multisets;
    }

    const ALL_MULTISETS = getAllMultisets();

    function canCombineStacks(countsA, countsB) {
      for (const spec of CUTTER_SPECS) {
        if ((countsA[spec.id] || 0) + (countsB[spec.id] || 0) > spec.maxQty) {
          return false;
        }
      }
      return true;
    }

    function allocateShimsAcrossGaps(totalShimT, maxGapT, canUse03 = true) {
      const m = maxGapT.length;
      let best = null;
      let bestCost = Infinity;

      function dfs(idx, remT, current) {
        if (idx === m) {
          if (remT !== 0) return;
          let cost = 0;
          const overlaps = current.map((g, i) => maxGapT[i] - g);
          const avgOv = overlaps.reduce((a, b) => a + b, 0) / m;
          const decomps = decomposeGapList(current, canUse03);
          for (let i = 0; i < m; i++) {
            const g = current[i];
            const ov = overlaps[i];
            if (ov === 0) cost += 50;
            if (g < 3) cost += (3 - g) * 60;
            cost += Math.pow(ov - avgOv, 2) * 8;
            cost += decomps[i].totalCount * 3;
          }
          if (cost < bestCost) {
            bestCost = cost;
            best = [...current];
          }
          return;
        }
        const maxRem = maxGapT.slice(idx + 1).reduce((a, b) => a + b, 0);
        const minRem = m - 1 - idx;
        const low = Math.max(1, remT - maxRem);
        const high = Math.min(maxGapT[idx], remT - minRem);
        for (let g = low; g <= high; g++) {
          current.push(g);
          dfs(idx + 1, remT - g, current);
          current.pop();
        }
      }

      dfs(0, totalShimT, []);
      return best;
    }

    // Solve exact width stack (for Groove mode)
    function solveExactStack(targetMm, orientBottomToBearing = true) {
      const targetT = toTenths(targetMm);
      const solutions = [];

      for (const c of CUTTER_SPECS) {
        if (toTenths(c.width) === targetT) {
          solutions.push({
            counts: { [c.id]: 1 },
            cutters: [c],
            gapsTenths: [],
            gapsDecomposed: [],
            totalShimTenths: 0,
            actualWidthMm: c.width,
            used03: false,
            shimPieces: 0,
            score: 1000
          });
        }
      }

      for (const sub of ALL_MULTISETS) {
        if (sub.cutters.length < 2) continue;
        const ordered = orientBottomToBearing ? [...sub.cutters] : [...sub.cutters].reverse();
        const k = ordered.length;

        const topOverhangH = Math.round(ordered[0].overhang * 100);
        const botOverhangH = Math.round(ordered[k - 1].overhang * 100);
        const bodiesH = ordered.reduce((acc, c) => acc + Math.round(c.body * 100), 0);
        const neededShimH = targetT * 10 - (topOverhangH + bodiesH + botOverhangH);

        if (neededShimH % 10 !== 0) continue;
        const totalShimT = neededShimH / 10;
        if (totalShimT < k - 1) continue;

        const maxGapT = [];
        let maxPossibleShimT = 0;
        for (let i = 0; i < k - 1; i++) {
          const jMax = Math.round((ordered[i].overhang + ordered[i + 1].overhang) * 10);
          maxGapT.push(jMax);
          maxPossibleShimT += jMax;
        }
        if (totalShimT > maxPossibleShimT) continue;

        const alloc = allocateShimsAcrossGaps(totalShimT, maxGapT, true);
        if (!alloc) continue;

        const gapsDecomposed = decomposeGapList(alloc, true);
        const used03 = gapsDecomposed.some((g) => g.used03);
        const overlapsMm = alloc.map((t, i) => (maxGapT[i] - t) / 10);
        const totalOverlapMm = overlapsMm.reduce((a, b) => a + b, 0);
        const minOverlapMm = Math.min(...overlapsMm);
        const minShimMm = Math.min(...alloc) / 10;
        const shimPieces = gapsDecomposed.reduce((a, g) => a + g.totalCount, 0);

        let score = 0;
        const avgOverlap = totalOverlapMm / (k - 1);
        if (minOverlapMm >= 0.2) score += 300;
        else if (minOverlapMm >= 0.1) score += 180;
        else score += 20;

        score -= Math.abs(avgOverlap - 0.75) * 90;
        if (minShimMm >= 0.5) score += 120;
        else if (minShimMm >= 0.3) score += 70;
        else if (minShimMm < 0.2) score -= 120;

        score -= k * 45;
        score -= shimPieces * 4;

        solutions.push({
          counts: sub.counts,
          cutters: ordered,
          gapsTenths: alloc,
          gapsDecomposed,
          totalShimTenths: totalShimT,
          actualWidthMm: targetT / 10,
          used03,
          shimPieces,
          score
        });
      }

      solutions.sort((a, b) => b.score - a.score);
      return solutions;
    }

    // Solve shoulder stack (for Tongue mode): any stack >= minMm works
    function solveShoulderStack(minMm, orientBottomToBearing = true) {
      const minT = toTenths(minMm);
      const candidates = [];

      for (const c of CUTTER_SPECS) {
        const wT = toTenths(c.width);
        if (wT >= minT) {
          const excessMm = (wT - minT) / 10;
          candidates.push({
            counts: { [c.id]: 1 },
            cutters: [c],
            gapsTenths: [],
            gapsDecomposed: [],
            totalShimTenths: 0,
            actualWidthMm: c.width,
            used03: false,
            shimPieces: 0,
            score: 1200 - excessMm * 25
          });
        }
      }

      for (const sub of ALL_MULTISETS) {
        if (sub.cutters.length < 2 || sub.cutters.length > 3) continue;
        const ordered = orientBottomToBearing ? [...sub.cutters] : [...sub.cutters].reverse();
        const k = ordered.length;

        const topOverhangH = Math.round(ordered[0].overhang * 100);
        const botOverhangH = Math.round(ordered[k - 1].overhang * 100);
        const bodiesH = ordered.reduce((acc, c) => acc + Math.round(c.body * 100), 0);
        const baseWidthT = (topOverhangH + bodiesH + botOverhangH) / 10;

        const maxGapT = [];
        let maxPossibleShimT = 0;
        for (let i = 0; i < k - 1; i++) {
          const jMax = Math.round((ordered[i].overhang + ordered[i + 1].overhang) * 10);
          maxGapT.push(jMax);
          maxPossibleShimT += jMax;
        }

        const neededMinShimT = Math.max(k - 1, Math.ceil(minT - baseWidthT));
        if (neededMinShimT > maxPossibleShimT) continue;

        let bestForSub = null;
        for (let totT = neededMinShimT; totT <= maxPossibleShimT; totT++) {
          const actualT = baseWidthT + totT;
          if (actualT < minT) continue;
          if (actualT > minT + 25) break;

          // Keep 0.3mm spacer free for bearing shims unless needed
          const alloc = allocateShimsAcrossGaps(totT, maxGapT, false);
          if (!alloc) continue;
          const gapsDecomposed = decomposeGapList(alloc, false);
          const overlapsMm = alloc.map((t, i) => (maxGapT[i] - t) / 10);
          const minOverlapMm = Math.min(...overlapsMm);
          const minShimMm = Math.min(...alloc) / 10;
          if (minOverlapMm < 0.1 || minShimMm < 0.3) continue;

          const shimPieces = gapsDecomposed.reduce((a, g) => a + g.totalCount, 0);
          const excessMm = (actualT - minT) / 10;
          const score = 600 - k * 110 - shimPieces * 18 - excessMm * 15;

          if (!bestForSub || score > bestForSub.score) {
            bestForSub = {
              counts: sub.counts,
              cutters: ordered,
              gapsTenths: alloc,
              gapsDecomposed,
              totalShimTenths: totT,
              actualWidthMm: actualT / 10,
              used03: false,
              shimPieces,
              score
            };
          }
        }
        if (bestForSub) candidates.push(bestForSub);
      }

      candidates.sort((a, b) => b.score - a.score);
      return candidates;
    }

    function solveGrooveMode(grooveMm) {
      const stacks = solveExactStack(grooveMm, true);
      return stacks.map((st) => {
        const botCutter = st.cutters[st.cutters.length - 1];
        const bearingShimT = botCutter.overhang >= 1.0 ? 15 : 10;
        return {
          mode: "groove",
          stack: st,
          bearingShim: decomposeShims(bearingShimT, !st.used03),
          score: st.score
        };
      });
    }

    // Split total bearing shim (in tenths) into top and bottom bearing shims, using at most ONE 0.3mm spacer total
    function splitBearingShims(totalBrgShimT, topInnerOverhang, botInnerOverhang, canUse03 = true) {
      let best = null;
      let bestCost = Infinity;
      const idealTopT = Math.max(1, Math.round((totalBrgShimT * topInnerOverhang) / (topInnerOverhang + botInnerOverhang)));

      for (let topT = 1; topT <= totalBrgShimT - 1; topT++) {
        const botT = totalBrgShimT - topT;
        const [dTop, dBot] = decomposeGapList([topT, botT], canUse03);
        let cost = (dTop.totalCount + dBot.totalCount) * 6 + Math.abs(topT - idealTopT) * 1.5;
        if (topT < topInnerOverhang * 10) cost += (topInnerOverhang * 10 - topT) * 15;
        if (botT < botInnerOverhang * 10) cost += (botInnerOverhang * 10 - botT) * 15;
        if (cost < bestCost) {
          bestCost = cost;
          best = { top: dTop, bot: dBot };
        }
      }
      return best;
    }

    function solveTongueMode(tongueMm, topShoulderMm, botShoulderMm, bearing) {
      const topStacks = solveShoulderStack(topShoulderMm, true);
      const botStacks = solveShoulderStack(botShoulderMm, false);
      const tongueT = toTenths(tongueMm);
      const bearingHeightT = toTenths(bearing.height);

      const results = [];
      let bearingTooTallError = false;
      let inventoryError = false;

      if (topStacks.length === 0 || botStacks.length === 0) {
        return { solutions: [], error: "Shoulder width exceeds capacity of available cutters." };
      }

      for (const topSt of topStacks) {
        for (const botSt of botStacks) {
          if (!canCombineStacks(topSt.counts, botSt.counts)) {
            inventoryError = true;
            continue;
          }

          const topInner = topSt.cutters[topSt.cutters.length - 1];
          const botInner = botSt.cutters[0];
          const innerOverhangSumT = Math.round((topInner.overhang + botInner.overhang) * 10);
          const totalBrgShimT = tongueT - bearingHeightT + innerOverhangSumT;

          if (totalBrgShimT < 2) {
            bearingTooTallError = true;
            continue;
          }

          const canUse03 = !topSt.used03 && !botSt.used03;
          const split = splitBearingShims(totalBrgShimT, topInner.overhang, botInner.overhang, canUse03);
          if (!split) continue;

          const totalBrgPieces = split.top.totalCount + split.bot.totalCount;
          let score = topSt.score + botSt.score - totalBrgPieces * 6;
          if (topShoulderMm === botShoulderMm && topSt.cutters.map((c) => c.id).join() === botSt.cutters.map((c) => c.id).join()) {
            score += 35;
          }

          results.push({
            mode: "tongue",
            topStack: topSt,
            botStack: botSt,
            topBrgShim: split.top,
            botBrgShim: split.bot,
            score
          });
        }
      }

      results.sort((a, b) => b.score - a.score);

      let error = null;
      if (results.length === 0) {
        if (bearingTooTallError) {
          error = `Cutting depth ${bearing.depth} mm (bearing ${bearing.id}, H ${bearing.height.toFixed(1)} mm) is too tall for a ${tongueMm.toFixed(1)} mm tongue. Try 8.0 mm depth (H 4.9 mm) or increase tongue thickness.`;
        } else if (inventoryError) {
          error = `Not enough cutters in the set to form ${topShoulderMm.toFixed(1)} mm and ${botShoulderMm.toFixed(1)} mm shoulders simultaneously.`;
        } else {
          error = `No valid combination found.`;
        }
      }

      return { solutions: results, error };
    }

    // State
    let mode = "groove";
    let grooveWidth = 18.0;
    let tongueWidth = 6.0;
    let topCutWidth = 5.0;
    let botCutWidth = 5.0;
    let symmetric = true;
    let currentSolutions = [];
    let selectedIdx = 0;

    // Elements
    const tabGroove = document.getElementById("tabGroove");
    const tabTongue = document.getElementById("tabTongue");
    const grooveControls = document.getElementById("grooveControls");
    const tongueControls = document.getElementById("tongueControls");

    const grooveWidthEl = document.getElementById("grooveWidth");
    const tongueWidthEl = document.getElementById("tongueWidth");
    const topCutWidthEl = document.getElementById("topCutWidth");
    const botCutWidthEl = document.getElementById("botCutWidth");
    const symCheckEl = document.getElementById("symCheck");
    const botCutGroupEl = document.getElementById("botCutGroup");
    const topCutLabelEl = document.getElementById("topCutLabel");
    const bearingSelectEl = document.getElementById("bearingSelect");

    const altSection = document.getElementById("altSection");
    const altList = document.getElementById("altList");
    const errorBox = document.getElementById("errorBox");
    const svgContainer = document.getElementById("svgContainer");

    function updateCalculation() {
      const bearing = BEARINGS[bearingSelectEl.value];
      selectedIdx = 0;

      if (mode === "groove") {
        currentSolutions = solveGrooveMode(grooveWidth);
        if (currentSolutions.length === 0) {
          showError(`No single-pass combination for ${grooveWidth.toFixed(1)} mm.`);
          return;
        }
        hideError();
        renderAll();
      } else {
        const bWidth = symmetric ? topCutWidth : botCutWidth;
        const res = solveTongueMode(tongueWidth, topCutWidth, bWidth, bearing);
        currentSolutions = res.solutions;
        if (res.error || currentSolutions.length === 0) {
          showError(res.error);
          return;
        }
        hideError();
        renderAll();
      }
    }

    function showError(msg) {
      errorBox.hidden = false;
      errorBox.textContent = msg;
      svgContainer.hidden = true;
      altSection.hidden = true;
    }

    function hideError() {
      errorBox.hidden = true;
      svgContainer.hidden = false;
      altSection.hidden = currentSolutions.length <= 1;
    }

    function renderAll() {
      const bearing = BEARINGS[bearingSelectEl.value];
      const sol = currentSolutions[selectedIdx];

      if (mode === "groove") {
        renderGrooveSvg(sol, bearing);
      } else {
        renderTongueSvg(sol, bearing);
      }
      renderAlternatives();
    }

    function renderAlternatives() {
      altList.innerHTML = "";
      currentSolutions.slice(0, 6).forEach((sol, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "alt-btn";
        btn.setAttribute("aria-selected", idx === selectedIdx ? "true" : "false");

        if (sol.mode === "groove") {
          btn.textContent = sol.stack.cutters.map((c) => `${c.id}`).join(" + ") + " mm";
        } else {
          const topStr = sol.topStack.cutters.map((c) => `${c.id}`).join("+");
          const botStr = sol.botStack.cutters.map((c) => `${c.id}`).join("+");
          btn.textContent = `${topStr} / ${botStr} mm`;
        }

        btn.addEventListener("click", () => {
          selectedIdx = idx;
          renderAll();
        });
        altList.appendChild(btn);
      });
    }

    function svgDefs() {
      return `
        <defs>
          <pattern id="woodGrain" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="7" height="7" fill="var(--sunken)" />
            <line x1="0" y1="0" x2="0" y2="7" stroke="var(--rule-strong)" stroke-width="1.5" />
          </pattern>
        </defs>
      `;
    }

    function drawShimStackSvg(washers, cx, startY, totalGapPx, shimW = 86) {
      const n = washers.length;
      if (n === 0) return "";
      const out = [];
      const sep = n > 1 ? Math.min(1.4, (totalGapPx * 0.38) / (n - 1)) : 0;
      const availH = Math.max(n * 1.2, totalGapPx - sep * (n - 1));
      const weights = washers.map((w) => Math.pow(w, 0.55));
      const weightSum = weights.reduce((a, b) => a + b, 0);

      let cursorY = startY;
      weights.forEach((wt) => {
        const h = (wt / weightSum) * availH;
        out.push(
          `<rect x="${cx - shimW / 2}" y="${cursorY.toFixed(2)}" width="${shimW}" height="${Math.max(1.1, h).toFixed(2)}" fill="#23272e" rx="0.8"/>`
        );
        cursorY += h + sep;
      });
      return out.join("");
    }

    function drawVertDim(x, y1, y2, label) {
      const midY = (y1 + y2) / 2;
      return `
        <line x1="${x - 4}" y1="${y1}" x2="${x + 4}" y2="${y1}" stroke="var(--ink-soft)" stroke-width="1.2"/>
        <line x1="${x - 4}" y1="${y2}" x2="${x + 4}" y2="${y2}" stroke="var(--ink-soft)" stroke-width="1.2"/>
        <line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="var(--ink-soft)" stroke-width="1.2"/>
        <rect x="${x - 28}" y="${midY - 9}" width="56" height="18" rx="3" fill="var(--paper)" />
        <text x="${x}" y="${midY + 4}" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink)">${label}</text>
      `;
    }

    function drawHorizDim(x1, x2, y, label) {
      const midX = (x1 + x2) / 2;
      return `
        <line x1="${x1}" y1="${y - 4}" x2="${x1}" y2="${y + 4}" stroke="var(--ink-soft)" stroke-width="1.2"/>
        <line x1="${x2}" y1="${y - 4}" x2="${x2}" y2="${y + 4}" stroke="var(--ink-soft)" stroke-width="1.2"/>
        <line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="var(--ink-soft)" stroke-width="1.2"/>
        <text x="${midX}" y="${y - 6}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink-soft)">${label}</text>
      `;
    }

    function renderGrooveSvg(sol, bearing) {
      const scale = 13;
      const cx = 245;
      const cutterDiamPx = 240;
      const arborShaftW = 42;
      const carbideW = 36;

      const st = sol.stack;
      const k = st.cutters.length;
      const topOverhang = st.cutters[0].overhang;
      const bodiesSum = st.cutters.reduce((a, c) => a + c.body, 0);
      const interShimsSum = st.totalShimTenths / 10;
      const bearingShimMm = sol.bearingShim.tenths / 10;

      const shoulderY = 76;
      const topCarbideY = shoulderY - topOverhang * scale;
      const botCarbideY = topCarbideY + grooveWidth * scale;
      const totalStackPx = (bodiesSum + interShimsSum + bearingShimMm + bearing.height) * scale;
      const svgHeight = Math.max(350, Math.round(shoulderY + totalStackPx + 82));

      const out = [svgDefs()];

      out.push(`
        <rect x="${cx - 23}" y="10" width="46" height="${shoulderY - 20}" rx="3" fill="#23272e" />
        <rect x="${cx - 29}" y="${shoulderY - 11}" width="58" height="11" rx="2" fill="#23272e" />
        <rect x="${cx - arborShaftW / 2}" y="${shoulderY}" width="${arborShaftW}" height="${totalStackPx}" fill="#d1d5db" stroke="#4b5563" stroke-width="1"/>
      `);

      let curY = shoulderY;
      const leftEdgeX = cx - cutterDiamPx / 2;
      const rightEdgeX = cx + cutterDiamPx / 2;
      const labelX = rightEdgeX + 14;

      st.cutters.forEach((c, idx) => {
        const bodyH = c.body * scale;
        const edgeH = c.width * scale;
        const edgeTopY = curY - c.overhang * scale;

        out.push(`
          <rect x="${leftEdgeX}" y="${edgeTopY}" width="${carbideW}" height="${edgeH}" rx="1.5" fill="#9ca3af" stroke="#374151" stroke-width="1.2"/>
          <rect x="${rightEdgeX - carbideW}" y="${edgeTopY}" width="${carbideW}" height="${edgeH}" rx="1.5" fill="#9ca3af" stroke="#374151" stroke-width="1.2"/>
          <rect x="${leftEdgeX + 8}" y="${curY}" width="${cutterDiamPx - 16}" height="${bodyH}" fill="#ff6b18" stroke="#7c2d12" stroke-width="1.1"/>
          <text x="${labelX}" y="${curY + bodyH / 2 + 4}" font-size="13" font-weight="700" fill="var(--ink)">${c.name}</text>
        `);
        curY += bodyH;

        if (idx < k - 1) {
          const gap = st.gapsDecomposed[idx];
          const gapPx = (gap.tenths / 10) * scale;
          out.push(drawShimStackSvg(gap.washers, cx, curY, gapPx));
          out.push(`
            <line x1="${cx + 46}" y1="${curY + gapPx / 2}" x2="${labelX - 4}" y2="${curY + gapPx / 2}" stroke="var(--rule-strong)" stroke-dasharray="2,3"/>
            <text x="${labelX}" y="${curY + gapPx / 2 + 4}" font-size="11.5" font-weight="600" fill="var(--ink-soft)">
              ${gap.mm} mm (${gap.formula})
            </text>
          `);
          curY += gapPx;
        }
      });

      const brgShimPx = bearingShimMm * scale;
      out.push(drawShimStackSvg(sol.bearingShim.washers, cx, curY, brgShimPx));
      out.push(`
        <line x1="${cx + 46}" y1="${curY + brgShimPx / 2}" x2="${labelX - 4}" y2="${curY + brgShimPx / 2}" stroke="var(--rule-strong)" stroke-dasharray="2,3"/>
        <text x="${labelX}" y="${curY + brgShimPx / 2 + 4}" font-size="11.5" font-weight="600" fill="var(--ink-soft)">
          ${sol.bearingShim.mm} mm (${sol.bearingShim.formula})
        </text>
      `);
      curY += brgShimPx;

      const bearingW = Math.round((bearing.od / 47.6) * cutterDiamPx);
      const bearingH = bearing.height * scale;
      out.push(`
        <rect x="${cx - bearingW / 2}" y="${curY}" width="${bearingW}" height="${bearingH}" rx="3" fill="#e5e7eb" stroke="#374151" stroke-width="1.4"/>
        <rect x="${cx - bearingW / 2 + 8}" y="${curY + 3}" width="${bearingW - 16}" height="${bearingH - 6}" rx="1.5" fill="#d1d5db" stroke="#9ca3af" stroke-width="1"/>
        <line x1="${cx + bearingW / 2 + 4}" y1="${curY + bearingH / 2}" x2="${labelX - 4}" y2="${curY + bearingH / 2}" stroke="var(--rule-strong)" stroke-dasharray="2,3"/>
        <text x="${labelX}" y="${curY + bearingH / 2 + 4}" font-size="12.5" font-weight="700" fill="var(--ink)">${bearing.id} (&Oslash;${bearing.od})</text>
      `);
      curY += bearingH;

      out.push(`
        <rect x="${cx - 29}" y="${curY + 5}" width="58" height="9" rx="1" fill="#23272e"/>
        <rect x="${cx - 29}" y="${curY + 17}" width="58" height="9" rx="1" fill="#23272e"/>
        <rect x="${cx - 31}" y="${curY + 30}" width="62" height="19" rx="4" fill="#23272e"/>
      `);

      const woodLeftX = 12;
      const grooveLeftX = leftEdgeX - 2;
      const woodRightX = grooveLeftX + (bearing.depth / 47.6) * cutterDiamPx;
      const woodTopY = Math.max(24, topCarbideY - 34);
      const woodBotY = Math.min(svgHeight - 16, botCarbideY + 36);

      out.push(`
        <path d="
          M ${woodLeftX} ${woodTopY}
          L ${woodRightX} ${woodTopY}
          L ${woodRightX} ${topCarbideY}
          L ${grooveLeftX} ${topCarbideY}
          L ${grooveLeftX} ${botCarbideY}
          L ${woodRightX} ${botCarbideY}
          L ${woodRightX} ${woodBotY}
          L ${woodLeftX} ${woodBotY}
          Z
        " fill="url(#woodGrain)" stroke="var(--ink-soft)" stroke-width="1.4"/>
      `);

      out.push(drawVertDim(woodLeftX + 36, topCarbideY, botCarbideY, `${grooveWidth.toFixed(1)} mm`));
      out.push(drawHorizDim(grooveLeftX, woodRightX, woodTopY - 8, `${bearing.depth} mm`));

      svgContainer.innerHTML = `<svg viewBox="0 0 540 ${svgHeight}" width="100%" style="max-width:540px; height:auto; display:block;">${out.join("\n")}</svg>`;
    }

    function renderTongueSvg(sol, bearing) {
      const scale = 12.5;
      const cx = 245;
      const cutterDiamPx = 240;
      const arborShaftW = 42;
      const carbideW = 36;

      const topSt = sol.topStack;
      const botSt = sol.botStack;
      const topBodies = topSt.cutters.reduce((a, c) => a + c.body, 0);
      const botBodies = botSt.cutters.reduce((a, c) => a + c.body, 0);
      const topInterShims = topSt.totalShimTenths / 10;
      const botInterShims = botSt.totalShimTenths / 10;
      const topBrgShimMm = sol.topBrgShim.tenths / 10;
      const botBrgShimMm = sol.botBrgShim.tenths / 10;

      const shoulderY = 74;
      const totalStackMm = topBodies + topInterShims + topBrgShimMm + bearing.height + botBrgShimMm + botBodies + botInterShims;
      const totalStackPx = totalStackMm * scale;
      const svgHeight = Math.max(380, Math.round(shoulderY + totalStackPx + 82));

      const out = [svgDefs()];

      out.push(`
        <rect x="${cx - 23}" y="10" width="46" height="${shoulderY - 20}" rx="3" fill="#23272e" />
        <rect x="${cx - 29}" y="${shoulderY - 11}" width="58" height="11" rx="2" fill="#23272e" />
        <rect x="${cx - arborShaftW / 2}" y="${shoulderY}" width="${arborShaftW}" height="${totalStackPx}" fill="#d1d5db" stroke="#4b5563" stroke-width="1"/>
      `);

      let curY = shoulderY;
      const leftEdgeX = cx - cutterDiamPx / 2;
      const rightEdgeX = cx + cutterDiamPx / 2;
      const labelX = rightEdgeX + 14;

      topSt.cutters.forEach((c, idx) => {
        const bodyH = c.body * scale;
        const edgeH = c.width * scale;
        const edgeTopY = curY - c.overhang * scale;
        out.push(`
          <rect x="${leftEdgeX}" y="${edgeTopY}" width="${carbideW}" height="${edgeH}" rx="1.5" fill="#9ca3af" stroke="#374151" stroke-width="1.2"/>
          <rect x="${rightEdgeX - carbideW}" y="${edgeTopY}" width="${carbideW}" height="${edgeH}" rx="1.5" fill="#9ca3af" stroke="#374151" stroke-width="1.2"/>
          <rect x="${leftEdgeX + 8}" y="${curY}" width="${cutterDiamPx - 16}" height="${bodyH}" fill="#ff6b18" stroke="#7c2d12" stroke-width="1.1"/>
          <text x="${labelX}" y="${curY + bodyH / 2 + 4}" font-size="13" font-weight="700" fill="var(--ink)">${c.name}</text>
        `);
        curY += bodyH;

        if (idx < topSt.cutters.length - 1) {
          const gap = topSt.gapsDecomposed[idx];
          const gapPx = (gap.tenths / 10) * scale;
          out.push(drawShimStackSvg(gap.washers, cx, curY, gapPx));
          out.push(`
            <line x1="${cx + 46}" y1="${curY + gapPx / 2}" x2="${labelX - 4}" y2="${curY + gapPx / 2}" stroke="var(--rule-strong)" stroke-dasharray="2,3"/>
            <text x="${labelX}" y="${curY + gapPx / 2 + 4}" font-size="11.5" font-weight="600" fill="var(--ink-soft)">${gap.mm} mm (${gap.formula})</text>
          `);
          curY += gapPx;
        }
      });

      const topInnerCutter = topSt.cutters[topSt.cutters.length - 1];
      const tongueTopY = curY + topInnerCutter.overhang * scale;

      const topBrgShimPx = topBrgShimMm * scale;
      out.push(drawShimStackSvg(sol.topBrgShim.washers, cx, curY, topBrgShimPx));
      out.push(`
        <line x1="${cx + 46}" y1="${curY + topBrgShimPx / 2}" x2="${labelX - 4}" y2="${curY + topBrgShimPx / 2}" stroke="var(--rule-strong)" stroke-dasharray="2,3"/>
        <text x="${labelX}" y="${curY + topBrgShimPx / 2 + 4}" font-size="11.5" font-weight="600" fill="var(--ink-soft)">${sol.topBrgShim.mm} mm (${sol.topBrgShim.formula})</text>
      `);
      curY += topBrgShimPx;

      const bearingW = Math.round((bearing.od / 47.6) * cutterDiamPx);
      const bearingH = bearing.height * scale;
      out.push(`
        <rect x="${cx - bearingW / 2}" y="${curY}" width="${bearingW}" height="${bearingH}" rx="3" fill="#e5e7eb" stroke="#374151" stroke-width="1.4"/>
        <rect x="${cx - bearingW / 2 + 8}" y="${curY + 3}" width="${bearingW - 16}" height="${bearingH - 6}" rx="1.5" fill="#d1d5db" stroke="#9ca3af" stroke-width="1"/>
        <line x1="${cx + bearingW / 2 + 4}" y1="${curY + bearingH / 2}" x2="${labelX - 4}" y2="${curY + bearingH / 2}" stroke="var(--rule-strong)" stroke-dasharray="2,3"/>
        <text x="${labelX}" y="${curY + bearingH / 2 + 4}" font-size="12.5" font-weight="700" fill="var(--ink)">${bearing.id} (&Oslash;${bearing.od})</text>
      `);
      curY += bearingH;

      const botBrgShimPx = botBrgShimMm * scale;
      out.push(drawShimStackSvg(sol.botBrgShim.washers, cx, curY, botBrgShimPx));
      out.push(`
        <line x1="${cx + 46}" y1="${curY + botBrgShimPx / 2}" x2="${labelX - 4}" y2="${curY + botBrgShimPx / 2}" stroke="var(--rule-strong)" stroke-dasharray="2,3"/>
        <text x="${labelX}" y="${curY + botBrgShimPx / 2 + 4}" font-size="11.5" font-weight="600" fill="var(--ink-soft)">${sol.botBrgShim.mm} mm (${sol.botBrgShim.formula})</text>
      `);
      curY += botBrgShimPx;

      const botInnerCutter = botSt.cutters[0];
      const tongueBotY = curY - botInnerCutter.overhang * scale;

      botSt.cutters.forEach((c, idx) => {
        const bodyH = c.body * scale;
        const edgeH = c.width * scale;
        const edgeTopY = curY - c.overhang * scale;
        out.push(`
          <rect x="${leftEdgeX}" y="${edgeTopY}" width="${carbideW}" height="${edgeH}" rx="1.5" fill="#9ca3af" stroke="#374151" stroke-width="1.2"/>
          <rect x="${rightEdgeX - carbideW}" y="${edgeTopY}" width="${carbideW}" height="${edgeH}" rx="1.5" fill="#9ca3af" stroke="#374151" stroke-width="1.2"/>
          <rect x="${leftEdgeX + 8}" y="${curY}" width="${cutterDiamPx - 16}" height="${bodyH}" fill="#ff6b18" stroke="#7c2d12" stroke-width="1.1"/>
          <text x="${labelX}" y="${curY + bodyH / 2 + 4}" font-size="13" font-weight="700" fill="var(--ink)">${c.name}</text>
        `);
        curY += bodyH;

        if (idx < botSt.cutters.length - 1) {
          const gap = botSt.gapsDecomposed[idx];
          const gapPx = (gap.tenths / 10) * scale;
          out.push(drawShimStackSvg(gap.washers, cx, curY, gapPx));
          out.push(`
            <line x1="${cx + 46}" y1="${curY + gapPx / 2}" x2="${labelX - 4}" y2="${curY + gapPx / 2}" stroke="var(--rule-strong)" stroke-dasharray="2,3"/>
            <text x="${labelX}" y="${curY + gapPx / 2 + 4}" font-size="11.5" font-weight="600" fill="var(--ink-soft)">${gap.mm} mm (${gap.formula})</text>
          `);
          curY += gapPx;
        }
      });

      out.push(`
        <rect x="${cx - 29}" y="${curY + 5}" width="58" height="9" rx="1" fill="#23272e"/>
        <rect x="${cx - 29}" y="${curY + 17}" width="58" height="9" rx="1" fill="#23272e"/>
        <rect x="${cx - 31}" y="${curY + 30}" width="62" height="19" rx="4" fill="#23272e"/>
      `);

      const bWidth = symmetric ? topCutWidth : botCutWidth;
      const boardTopY = tongueTopY - topCutWidth * scale;
      const boardBotY = tongueBotY + bWidth * scale;
      const woodLeftX = 12;
      const shoulderX = leftEdgeX - 2;
      const tongueTipX = cx - bearingW / 2 - 2;

      out.push(`
        <path d="
          M ${woodLeftX} ${boardTopY}
          L ${shoulderX} ${boardTopY}
          L ${shoulderX} ${tongueTopY}
          L ${tongueTipX} ${tongueTopY}
          L ${tongueTipX} ${tongueBotY}
          L ${shoulderX} ${tongueBotY}
          L ${shoulderX} ${boardBotY}
          L ${woodLeftX} ${boardBotY}
          Z
        " fill="url(#woodGrain)" stroke="var(--ink-soft)" stroke-width="1.4"/>
      `);

      out.push(drawVertDim(woodLeftX + 36, tongueTopY, tongueBotY, `${tongueWidth.toFixed(1)} mm`));
      out.push(drawHorizDim(shoulderX, tongueTipX, boardTopY - 10, `${bearing.depth} mm`));

      svgContainer.innerHTML = `<svg viewBox="0 0 540 ${svgHeight}" width="100%" style="max-width:540px; height:auto; display:block;">${out.join("\n")}</svg>`;
    }

    // Event Wiring
    tabGroove.addEventListener("click", () => {
      mode = "groove";
      tabGroove.setAttribute("aria-checked", "true");
      tabTongue.setAttribute("aria-checked", "false");
      grooveControls.hidden = false;
      tongueControls.hidden = true;
      updateCalculation();
    });

    tabTongue.addEventListener("click", () => {
      mode = "tongue";
      tabTongue.setAttribute("aria-checked", "true");
      tabGroove.setAttribute("aria-checked", "false");
      tongueControls.hidden = false;
      grooveControls.hidden = true;
      updateCalculation();
    });

    symCheckEl.addEventListener("change", (e) => {
      symmetric = e.target.checked;
      botCutGroupEl.hidden = symmetric;
      topCutLabelEl.textContent = symmetric ? "Shoulder width (each side)" : "Top shoulder width";
      if (symmetric) {
        botCutWidth = topCutWidth;
        botCutWidthEl.value = botCutWidth.toFixed(1);
      }
      updateCalculation();
    });

    function bindNumberInput(el, min, max, setter) {
      el.addEventListener("input", (e) => {
        const v = parseFloat(e.target.value);
        if (!isNaN(v) && v >= min && v <= max) {
          setter(Math.round(v * 10) / 10);
        }
      });
      el.addEventListener("change", (e) => {
        let v = parseFloat(e.target.value);
        if (isNaN(v)) v = min;
        v = Math.max(min, Math.min(max, Math.round(v * 10) / 10));
        el.value = v.toFixed(1);
        setter(v);
      });
    }

    bindNumberInput(grooveWidthEl, 2.0, 26.0, (v) => {
      grooveWidth = v;
      updateCalculation();
    });

    bindNumberInput(tongueWidthEl, 3.2, 16.0, (v) => {
      tongueWidth = v;
      updateCalculation();
    });

    bindNumberInput(topCutWidthEl, 1.0, 16.0, (v) => {
      topCutWidth = v;
      if (symmetric) {
        botCutWidth = v;
        botCutWidthEl.value = v.toFixed(1);
      }
      updateCalculation();
    });

    bindNumberInput(botCutWidthEl, 1.0, 16.0, (v) => {
      botCutWidth = v;
      updateCalculation();
    });

    bearingSelectEl.addEventListener("change", updateCalculation);

    updateCalculation();
  </script>
</body>
</html>
